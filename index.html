<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./SaiMatch-favicon.ico" type="image/x-icon">
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="./icon-512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="./site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SaiMatch">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#00a65a">
    <title>SaiMatch</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 760px;
            padding: 40px 28px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: block;
            width: 190px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 28px;
        }

        h1.surveyIntro {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.6;
            text-align: left;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            margin-top: 16px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #00a65a;
            color: #fff;
            font: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button:focus-visible {
            outline: 3px solid #222;
            outline-offset: 3px;
        }

        .button[aria-disabled="true"] {
            background: #a7c9b5;
            color: #fff;
            cursor: not-allowed;
            pointer-events: none;
        }

        .surveyOption {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 0;
            text-align: left;
        }

        .surveyContent {
            flex: 1;
            min-width: 0;
        }

        .surveyList {
            margin-top: 16px;
            padding: 0 22px;
            border: 1px solid #e1e6e3;
            border-radius: 12px;
        }

        .surveyOption + .surveyOption {
            border-top: 1px solid #e1e6e3;
        }

        .surveyTitle {
            margin: 0 0 6px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .surveyDescription {
            margin: 0;
            line-height: 1.6;
        }

        .surveyOption .button {
            width: auto;
            min-width: 108px;
            min-height: 40px;
            flex: 0 0 auto;
            margin-top: 2px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.875rem;
        }

        .surveyOption .button[aria-disabled="true"] {
            background: #d9e8dd;
            color: #4d6857;
        }

        .appPromotion {
            margin-top: 28px;
            padding: 24px;
            border-radius: 12px;
            background: #eff8f2;
        }

        .appPromotion h2 {
            margin: 0;
            font-size: 1.35rem;
        }

        .appPromotion p {
            margin: 8px 0 0;
            line-height: 1.6;
        }

        .appPromotion .button {
            margin-top: 18px;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            main {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 100vh;
                max-width: 100%;
                padding: 28px 16px;
                border-radius: 0;
                box-shadow: none;
            }

            .surveyList {
                padding: 0 16px;
            }

            .appPromotion {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="./SaiMatch.png" alt="SaiMatch">
        <h1 class="surveyIntro">以下のアンケートへのご協力お願いいたします。</h1>
        <div class="surveyList">
            <section class="surveyOption" aria-labelledby="internationalSurveyTitle">
                <div class="surveyContent">
                    <h2 class="surveyTitle" id="internationalSurveyTitle">国際交流調査</h2>
                    <p class="surveyDescription" id="internationalSurveyDescription">
                        埼玉大学の学生が、学部や国を越えて交流し、英語を練習できる場をつくるためのアンケートです。
                    </p>
                </div>
                <a
                    class="button"
                    aria-disabled="true"
                    tabindex="-1"
                    href="https://docs.google.com/forms/d/e/1FAIpQLSelBO0WdM6uK-UgJqyDpehLtmt5JhVKnMgw-SY11RGfwKhrqJ/viewform?usp=publish-editor"
                    aria-describedby="internationalSurveyDescription">
                    準備中
                </a>
            </section>
            <section class="surveyOption" aria-labelledby="generalSurveyTitle">
                <div class="surveyContent">
                    <h2 class="surveyTitle" id="generalSurveyTitle">詳細調査</h2>
                    <p class="surveyDescription" id="generalSurveyDescription">
                        国際交流に限らず、埼玉大学内での友人関係・勉強仲間などの交流についての調査です。
                    </p>
                </div>
                <a
                    class="button"
                    aria-disabled="true"
                    tabindex="-1"
                    href="https://docs.google.com/forms/d/e/1FAIpQLScNjD3u9nZ-uTHC2wsYWtdVUzub00qUPqc-qPqK5LcbOSAxqQ/viewform?usp=publish-editor"
                    aria-describedby="generalSurveyDescription">
                    準備中
                </a>
            </section>
            <section class="surveyOption" aria-labelledby="saimatchSurveyTitle">
                <div class="surveyContent">
                    <h2 class="surveyTitle" id="saimatchSurveyTitle">SaiMatch利用調査</h2>
                    <p class="surveyDescription" id="saimatchSurveyDescription">
                        需要の調査のため、SaiMatchを体験利用した方に対する調査です。
                    </p>
                </div>
                <a
                    class="button"
                    aria-disabled="true"
                    tabindex="-1"
                    href="https://docs.google.com/forms/d/e/1FAIpQLSdjcRpApzOpeZ5fgkSmJ7_zxi1VQ7-GAf51wrXHHOmZqWH_vw/viewform?usp=publish-editor"
                    aria-describedby="saimatchSurveyDescription">
                    準備中
                </a>
            </section>
        </div>
        <section class="appPromotion">
            <h2>SaiMatchを体験してみませんか？</h2>
            <p>学内の新しいつながりを見つけよう。</p>
            <a class="button" href="./app.html">SaiMatchを利用してみる　→</a>
        </section>
    </main>
</body>
</html>
