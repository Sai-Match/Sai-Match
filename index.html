<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./SaiMatch-favicon.ico" type="image/x-icon">
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="./icon-512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="./site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SaiMatch">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#00a65a">
    <title>SaiMatch</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 700px;
            padding: 32px 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo {
            display: block;
            width: 240px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 24px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(1.4rem, 5vw, 2rem);
            overflow-wrap: anywhere;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            margin-top: 16px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #00a65a;
            color: #fff;
            font: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button:focus-visible {
            outline: 3px solid #222;
            outline-offset: 3px;
        }

        .button:disabled {
            background: #a7c9b5;
            color: #fff;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            main {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 100vh;
                max-width: 100%;
                padding: 24px 16px;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="./SaiMatch.png" alt="SaiMatch">
        <h1>アンケートへのご協力お願いします。</h1>
        <button class="button" type="button" disabled aria-disabled="true">
            アンケート（準備中）
        </button>
        <a class="button" href="./app.html">SaiMatchを利用してみる</a>
    </main>
</body>
</html>
